<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Research Question Framing Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- Privacy Notice -->
        <div class="mb-6 text-sm text-gray-600 text-center">
            <p>{{ privacy_notice }} <a href="/privacy" class="text-blue-600 hover:text-blue-800 underline">Learn more</a></p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-lg shadow-md p-8">
            <!-- Header -->
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Medical Research Question Framing Tool</h1>
            <p class="text-gray-600 mb-8">Enter your question below. The tool will check if it's well-structured for research purposes.</p>

            <!-- Form -->
            <form id="question-form" class="space-y-4">
                <!-- Textarea -->
                <div>
                    <label for="question-input" class="block text-sm font-medium text-gray-700 mb-2">
                        Your Question
                    </label>
                    <textarea 
                        id="question-input" 
                        name="question"
                        rows="5" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
                        placeholder="Enter your medical research question"
                        aria-describedby="word-counter"
                    ></textarea>
                    
                    <!-- Word Counter -->
                    <div id="word-counter" class="mt-2 text-sm text-gray-500">
                        <span id="word-count">0</span> words
                        <span id="word-warning" class="text-amber-600 font-medium hidden ml-2">⚠️ Approaching limit (500 words)</span>
                    </div>
                </div>

                <!-- Validation Error (hidden by default) -->
                <div id="validation-error" class="hidden bg-red-50 border border-red-200 rounded-lg p-4">
                    <p class="text-red-800 text-sm font-medium"></p>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Check Question
                </button>
            </form>

            <!-- Result Area (hidden by default) -->
            <div id="result-area" class="hidden mt-8 space-y-4">
                <!-- Results will be rendered here by JavaScript -->
            </div>
        </div>

        <!-- Page Footer Disclaimer -->
        <div class="mt-8 text-center text-sm text-gray-500">
            <p>{{ page_disclaimer }}</p>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
